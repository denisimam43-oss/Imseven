    <script>
      // Workaround for third-party libraries attempting to set window.fetch
      if (typeof window !== 'undefined' && window.fetch) {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() { return originalFetch; },
            set(value) { console.warn("Ignored attempt to set window.fetch"); },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not redefine window.fetch", e);
        }
      }
    </script>
